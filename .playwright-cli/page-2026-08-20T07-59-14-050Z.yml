        - strong [ref=e382]: 新增尺寸項目
        - text: — 點擊「Add Dimension」，輸入每個尺寸的 Nominal、正負公差與分佈類型（Dist）。
      - listitem [ref=e383]:
        - strong [ref=e384]: 設定製程能力（Cp）
        - text: — 若有實測資料，用該行的 SPC 圖示匯入並校正；沒有的話可先用 1.0～1.33 作保守假設。
      - listitem [ref=e385]:
        - strong [ref=e386]: 輸入規格界限
        - text: — 於下方 Specification Settings 輸入 LSL/USL，或用 Target Cpk 模式自動反推。
      - listitem [ref=e387]:
        - strong [ref=e388]: 執行模擬
        - text: — 點擊「Run Analysis」，程式會依各尺寸的分佈隨機抽樣並組合，計算整體良率與 Cpk。
      - listitem [ref=e389]:
        - strong [ref=e390]: 判讀結果
        - text: — 查看結果卡片與模擬結果下方的解讀說明；若 Cpk 偏低，參考 Contribution Analysis 找出主要變異來源優先改善。
